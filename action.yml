name: Skill Doctor Quality Gate
description: CI quality gate for Agent Skills.
author: San-Z1

branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: Path to a SKILL.md file, one skill directory, or a skills collection.
    required: false
    default: skills
  fail-on:
    description: Lowest finding severity that should fail the workflow.
    required: false
    default: warning
  config:
    description: Optional JSON config file path.
    required: false
    default: ""
  summary:
    description: Write a Markdown report to the workflow step summary.
    required: false
    default: "true"
  compare-ref:
    description: Git baseline ref. Defaults to the pull request base commit on pull request events.
    required: false
    default: ""
  fail-on-risk:
    description: Lowest change risk that should fail the workflow (none, low, medium, high).
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Install Skill Doctor
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run Skill Doctor
      shell: bash
      env:
        SD_PATH: ${{ inputs.path }}
        SD_FAIL_ON: ${{ inputs.fail-on }}
        SD_CONFIG: ${{ inputs.config }}
        SD_SUMMARY: ${{ inputs.summary }}
        SD_COMPARE_REF: ${{ inputs.compare-ref }}
        SD_FAIL_ON_RISK: ${{ inputs.fail-on-risk }}
      run: python "$GITHUB_ACTION_PATH/scripts/run_action.py"
